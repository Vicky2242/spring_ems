services:
  mysql:
    image: mysql:8.4
    container_name: ems-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: employee_management
      MYSQL_ROOT_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - ems_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ppassword"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  ems_mysql_data:
